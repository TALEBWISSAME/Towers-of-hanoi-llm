<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tours de Hanoï</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tours de Hanoï</h1>

    <div id="plateau" aria-label="Plateau avec trois tours">
      <div class="tour" aria-label="Tour 1"></div>
      <div class="tour" aria-label="Tour 2"></div>
      <div class="tour" aria-label="Tour 3"></div>
    </div>

    <div class="commandes">
      <label for="nb-anneaux">Nombre d’anneaux :</label>
      <input type="number" id="nb-anneaux" min="1" max="8" value="3">
      <button id="btn-demarrer" type="button">Démarrer</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
